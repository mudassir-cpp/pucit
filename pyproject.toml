[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pucit"
dynamic = ["version"]
description = "PUCIT student toolkit CLI — Oracle, PF C/C++, campus bypass, and ease-of-use commands"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["pucit", "PUCIT", "oracle", "cpp", "g++", "docker", "bypass"]
authors = [
  { name = "MIZI", email = "gem920se@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Education",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.urls]
Documentation = "https://github.com/mudassir-cpp/pucit#readme"
Issues = "https://github.com/mudassir-cpp/pucit/issues"
Source = "https://github.com/mudassir-cpp/pucit"

[project.scripts]
pucit = "pucit.cli:app"
bypass_pucit = "bypass_pucit.main:main"

[tool.hatch.version]
path = "src/pucit/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pucit", "src/bypass_pucit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE.txt",
  "/run.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]